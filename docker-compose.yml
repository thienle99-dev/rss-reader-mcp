services:
  rss-mcp:
    build: .
    image: rss-reader-mcp:local
    container_name: rss-mcp
    restart: unless-stopped
    env_file: .env
    ports:
      - 127.0.0.1:18080:8080
    environment:
      RSS_MCP_HOST: 0.0.0.0
      RSS_MCP_PORT: 8080
      RSS_DB_PATH: /data/rss.db
    volumes:
      - ./data:/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    mem_limit: 256m
    cpus: 0.50
    pids_limit: 64
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/readyz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks:
      - goclaw-net

networks:
  goclaw-net:
    external: true
